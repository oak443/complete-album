[package]
name = "complete-album"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Write Picard-compatible MusicBrainz tags and Cover Art Archive artwork into a FLAC album folder"
license = "GPL-3.0-only"
repository = "https://github.com/oak443/complete-album"
readme = "README.md"
keywords = ["musicbrainz", "flac", "tagging", "cover-art", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
lofty = "0.25.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

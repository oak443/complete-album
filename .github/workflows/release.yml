name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="complete-album-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/complete-album.exe" "dist/${NAME}/"
          else
            cp "target/${{ matrix.target }}/release/complete-album" "dist/${NAME}/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${NAME}.zip" "${NAME}")
          else
            (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  copr:
    name: Fedora COPR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install COPR client
        run: python -m pip install --quiet copr

      - name: Submit and watch COPR build
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_OWNER: oak443
          COPR_PROJECT: complete-album
          COPR_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path

          from copr.v3 import Client

          config = Path.home() / ".config" / "copr"
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(
              "[copr-cli]\n"
              f"login = {os.environ['COPR_LOGIN']}\n"
              f"username = {os.environ['COPR_OWNER']}\n"
              f"token = {os.environ['COPR_TOKEN']}\n"
              "copr_url = https://copr.fedorainfracloud.org\n"
          )

          client = Client.create_from_config_file()
          repo = os.environ["GITHUB_REPOSITORY"]
          build = client.build_proxy.create_from_scm(
              os.environ["COPR_OWNER"],
              os.environ["COPR_PROJECT"],
              f"https://github.com/{repo}.git",
              committish=os.environ["COPR_TAG"],
              spec="complete-album.spec",
              source_build_method="make_srpm",
          )
          print(f"COPR build {build.id}: https://copr.fedorainfracloud.org/coprs/build/{build.id}/")

          deadline = time.time() + 40 * 60
          while True:
              try:
                  current = client.build_proxy.get(build.id)
                  print(f"COPR state: {current.state}")
                  if current.state in {"succeeded", "failed", "canceled", "skipped"}:
                      break
              except Exception as error:
                  print(f"COPR poll error: {error}")
              if time.time() > deadline:
                  raise SystemExit("COPR build timed out")
              time.sleep(15)

          if current.state != "succeeded":
              raise SystemExit(f"COPR build {current.state}")
          PY
